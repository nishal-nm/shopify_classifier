<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify Classifier Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Product Classification</h1>
                <p class="mt-1 text-sm text-slate-500">Upload your catalogue and automatically map to Shopify taxonomy.</p>
            </div>
            <button onclick="clearAllData()" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Clear Database
            </button>
        </header>

        <!-- Upload Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Import Products</h2>
            </div>
            
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <div class="flex-1 w-full relative">
                    <input type="file" id="excel-file" accept=".xlsx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-colors cursor-pointer border border-slate-200 rounded-lg">
                </div>
                <button onclick="uploadExcel()" id="upload-btn" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors whitespace-nowrap shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Upload & Process
                </button>
            </div>

            <!-- Progress Area -->
            <div id="progress-container" class="mt-6 hidden">
                <div class="flex justify-between items-center text-sm font-medium text-slate-700 mb-2">
                    <span id="progress-text" class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Uploading & Processing catalogue...
                    </span>
                </div>
                <!-- Indeterminate progress bar using CSS animation -->
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden relative">
                    <div id="progress-bar" class="absolute top-0 bottom-0 bg-indigo-600 rounded-full w-1/2 animate-[pulse_1.5s_ease-in-out_infinite] translate-x-[-100%]"></div>
                </div>
                <style>
                    #progress-bar {
                        animation: indeterminate 1.5s infinite linear;
                    }
                    @keyframes indeterminate {
                        0% { transform: translateX(-100%); width: 30%; }
                        50% { width: 50%; }
                        100% { transform: translateX(300%); width: 30%; }
                    }
                </style>
            </div>
        </div>

        <!-- Filters -->
        <div class="mb-6 flex flex-wrap gap-3">
            <button onclick="applyFilter('')" id="filter-all" class="filter-btn bg-slate-800 text-white px-5 py-2 rounded-full text-sm font-medium shadow-sm transition-colors">All Products</button>
            <button onclick="applyFilter('REVIEW')" id="filter-REVIEW" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 px-5 py-2 rounded-full text-sm font-medium transition-colors">Needs Review</button>
            <button onclick="applyFilter('COMPLETED')" id="filter-COMPLETED" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 px-5 py-2 rounded-full text-sm font-medium transition-colors">Completed</button>
            <button onclick="applyFilter('APPROVED')" id="filter-APPROVED" class="filter-btn bg-white text-slate-600 border border-slate-200 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200 px-5 py-2 rounded-full text-sm font-medium transition-colors">Approved</button>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider w-1/3">Product Details</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider w-1/3">Assigned Category & Alternatives</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Score</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200 bg-white">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination Footer -->
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                <div class="text-sm text-slate-500" id="pagination-info">
                    Showing <span class="font-medium">0</span> to <span class="font-medium">0</span> of <span class="font-medium">0</span> results
                </div>
                <div class="flex gap-2">
                    <button id="btn-prev" onclick="loadPage(currentPage - 1)" class="px-4 py-2 border border-slate-200 rounded-md text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Previous</button>
                    <button id="btn-next" onclick="loadPage(currentPage + 1)" class="px-4 py-2 border border-slate-200 rounded-md text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = '';
        let currentPage = 1;
        let totalPages = 1;
        let isLoading = false;

        function applyFilter(status) {
            currentFilter = status;
            currentPage = 1;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-5 py-2 rounded-full text-sm font-medium transition-colors";
            });
            
            const activeBtn = document.getElementById(status ? `filter-${status}` : 'filter-all');
            if (activeBtn) {
                activeBtn.className = "filter-btn bg-slate-800 text-white px-5 py-2 rounded-full text-sm font-medium shadow-sm transition-colors";
            }
            
            fetchClassifications();
        }

        function loadPage(page) {
            if (page < 1 || (totalPages && page > totalPages) || isLoading) return;
            currentPage = page;
            fetchClassifications();
        }

        function renderSkeleton() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                tbody.innerHTML += `
                    <tr class="animate-pulse">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-slate-200 rounded-lg"></div>
                                <div class="space-y-2 flex-1">
                                    <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                                    <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="h-4 bg-slate-200 rounded w-full mb-2"></div>
                            <div class="h-8 bg-slate-100 rounded w-full border border-slate-200"></div>
                        </td>
                        <td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded w-8"></div></td>
                        <td class="px-6 py-4"><div class="h-6 bg-slate-200 rounded-full w-20"></div></td>
                        <td class="px-6 py-4 text-right"><div class="h-8 bg-slate-200 rounded w-20 inline-block"></div></td>
                    </tr>
                `;
            }
        }

        function getStatusBadge(status) {
            const colors = {
                'REVIEW': 'bg-amber-100 text-amber-800 border-amber-200',
                'COMPLETED': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                'APPROVED': 'bg-blue-100 text-blue-800 border-blue-200',
                'PROCESSING': 'bg-slate-100 text-slate-800 border-slate-200',
                'FAILED': 'bg-red-100 text-red-800 border-red-200'
            };
            const classes = colors[status] || colors['PROCESSING'];
            return `<span class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border ${classes}">${status}</span>`;
        }

        async function fetchClassifications() {
            isLoading = true;
            renderSkeleton();

            let url = `/api/classifications/?page=${currentPage}`;
            if (currentFilter) url += `&status=${currentFilter}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = '';
                
                let items = data.results || data;
                let totalItems = data.count || items.length;
                
                // Pagination logic
                const pageSize = 50;
                totalPages = data.count ? Math.ceil(data.count / pageSize) : 1;
                
                const startIdx = totalItems === 0 ? 0 : ((currentPage - 1) * pageSize) + 1;
                const endIdx = data.count ? Math.min(currentPage * pageSize, totalItems) : items.length;
                
                document.getElementById('pagination-info').innerHTML = `Showing <span class="font-medium">${startIdx}</span> to <span class="font-medium">${endIdx}</span> of <span class="font-medium">${totalItems}</span> results`;
                document.getElementById('btn-prev').disabled = currentPage <= 1;
                document.getElementById('btn-next').disabled = currentPage >= totalPages;

                if (items.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">No products found for this filter.</td></tr>';
                    isLoading = false;
                    return;
                }

                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";
                    
                    let imgHtml = '<div class="w-12 h-12 bg-slate-100 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>';
                    
                    if (item.product.image_urls && item.product.image_urls.length > 0) {
                        imgHtml = `<img src="${item.product.image_urls[0]}" alt="Product" class="w-12 h-12 object-cover rounded-lg border border-slate-200 shadow-sm" onerror="this.outerHTML='${imgHtml}'">`;
                    }
                    
                    let altOptions = `<option value="">-- View or select alternatives --</option>`;
                    if (item.alternatives && item.alternatives.length > 0) {
                        item.alternatives.forEach(alt => {
                            altOptions += `<option value="${alt.category.id}">${alt.category.full_name || alt.category.name} (${parseFloat(alt.confidence).toFixed(2)})</option>`;
                        });
                    }

                    const score = parseFloat(item.confidence || 0);
                    const scoreColor = score >= 0.8 ? 'text-emerald-600' : (score >= 0.5 ? 'text-amber-600' : 'text-red-600');

                    tr.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-4">
                                ${imgHtml}
                                <div class="min-w-0 flex-1">
                                    <div class="font-semibold text-slate-900 truncate" title="${item.product.product_name}">${item.product.product_name}</div>
                                    <div class="text-xs text-slate-500 mt-0.5 truncate">${item.product.product_number} &bull; ${item.product.product_category || 'No Type'}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-slate-800 mb-2 truncate" title="${item.category ? (item.category.full_name || item.category.name) : 'None Assigned'}">
                                ${item.category ? (item.category.full_name || item.category.name) : 'None Assigned'}
                            </div>
                            <select id="alt-${item.id}" class="text-xs border border-slate-300 rounded-md p-1.5 w-full bg-slate-50 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500" onchange="updateCategory(${item.id})">
                                ${altOptions}
                            </select>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-bold ${scoreColor}">${(score * 100).toFixed(0)}%</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            ${getStatusBadge(item.status)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right">
                            <button onclick="approve(${item.id})" class="text-white bg-indigo-600 hover:bg-indigo-700 font-medium px-4 py-2 rounded-lg disabled:opacity-50 disabled:bg-slate-400 transition-colors shadow-sm text-sm" ${item.status === 'APPROVED' ? 'disabled' : ''}>
                                ${item.status === 'APPROVED' ? 'Approved' : 'Approve'}
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500 font-medium">Error loading data. Please refresh.</td></tr>';
            } finally {
                isLoading = false;
            }
        }

        async function approve(id) {
            try {
                const response = await fetch(`/api/classifications/${id}/approve/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') }
                });
                if (response.ok) fetchClassifications();
                else alert("Failed to approve");
            } catch (err) {
                console.error(err);
                alert("Error approving");
            }
        }

        async function updateCategory(id) {
            const select = document.getElementById(`alt-${id}`);
            const newCategoryId = select.value;
            if (!newCategoryId) return;

            try {
                const response = await fetch(`/api/classifications/${id}/`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ category: newCategoryId, status: 'COMPLETED' })
                });
                
                if (response.ok) fetchClassifications();
                else alert("Failed to update category");
            } catch (err) {
                console.error(err);
                alert("Error updating category");
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('excel-file');
            const btn = document.getElementById('upload-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            
            if (!fileInput.files.length) {
                alert("Please select an Excel file first.");
                return;
            }
            
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-wait');
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            progressContainer.classList.remove('hidden');
            progressText.innerHTML = `
                <svg class="animate-spin h-4 w-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Uploading file & processing...
            `;
            progressText.className = 'flex items-center gap-2 text-indigo-600 font-semibold text-xs uppercase tracking-wider';
            progressBar.style.animation = 'indeterminate 1.5s infinite linear';
            progressBar.className = 'absolute top-0 bottom-0 bg-indigo-600 rounded-full';
            
            try {
                const response = await fetch('/api/upload/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') },
                    body: formData
                });
                
                if (response.ok) {
                    fileInput.value = '';
                    pollStatus();
                } else {
                    const data = await response.json();
                    progressText.innerHTML = data.error || 'Upload failed.';
                    progressText.className = 'text-red-600 text-xs font-semibold';
                    progressBar.style.animation = 'none';
                    progressBar.style.width = '100%';
                    progressBar.className = 'absolute top-0 bottom-0 bg-red-500 rounded-full w-full';
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-wait');
                }
            } catch (err) {
                console.error(err);
                progressText.innerHTML = 'An error occurred during upload.';
                progressText.className = 'text-red-600 text-xs font-semibold';
                progressBar.style.animation = 'none';
                progressBar.style.width = '100%';
                progressBar.className = 'absolute top-0 bottom-0 bg-red-500 rounded-full w-full';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-wait');
            }
        }

        async function pollStatus() {
            const progressContainer = document.getElementById('progress-container');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            const btn = document.getElementById('upload-btn');

            try {
                const response = await fetch('/api/status/');
                const data = await response.json();
                
                if (data.status === 'PROCESSING') {
                    progressContainer.classList.remove('hidden');
                    
                    let total = data.total || 0;
                    let processed = data.processed || 0;
                    
                    progressText.innerHTML = `
                        <svg class="animate-spin h-4 w-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Working... (${processed} / ${total} products done)
                    `;
                    progressText.className = 'flex items-center gap-2 text-indigo-600 font-semibold text-xs uppercase tracking-wider';
                    progressBar.style.animation = 'indeterminate 1.5s infinite linear';
                    progressBar.className = 'absolute top-0 bottom-0 bg-indigo-600 rounded-full';
                    
                    setTimeout(pollStatus, 1500);
                } else if (data.status === 'COMPLETED') {
                    if (!progressContainer.classList.contains('hidden')) {
                        progressText.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Processing Complete!';
                        progressText.className = 'flex items-center gap-2 text-emerald-600 font-semibold text-xs uppercase tracking-wider';
                        
                        progressBar.style.animation = 'none';
                        progressBar.style.width = '100%';
                        progressBar.className = 'absolute top-0 bottom-0 bg-emerald-500 rounded-full w-full transition-all duration-300';
                        
                        btn.disabled = false;
                        btn.classList.remove('opacity-75', 'cursor-wait');
                        
                        setTimeout(() => {
                            progressContainer.classList.add('hidden');
                        }, 3000);
                        
                        currentPage = 1;
                        fetchClassifications();
                    }
                }
            } catch (err) {
                console.error(err);
                setTimeout(pollStatus, 2000);
            }
        }

        async function clearAllData() {
            if (!confirm("Are you sure you want to completely wipe all products and classifications from the database? This cannot be undone.")) return;
            
            try {
                const response = await fetch('/api/clear/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });
                
                if (response.ok) {
                    alert("Database cleared successfully.");
                    currentPage = 1;
                    fetchClassifications();
                } else {
                    alert("Failed to clear data.");
                }
            } catch (err) {
                console.error(err);
                alert("An error occurred while clearing data.");
            }
        }

        // Init
        fetchClassifications();
        pollStatus();
    </script>
</body>
</html>
